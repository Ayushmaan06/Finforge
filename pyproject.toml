[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "finforge"
version = "1.0.0"
description = "Market simulation and research platform: C++20 engine, Python research layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pyarrow>=17",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
# HTTP API, Postgres persistence and the job worker (finforge.server, PLAN Phase 7).
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "jsonschema>=4.23",
  "python-multipart>=0.0.9",
]

[project.scripts]
finforge = "finforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "empyrical-reloaded>=0.5.10",  # independent cross-check of the metrics, tests only
  "httpx>=0.27",  # FastAPI TestClient
  "ruff==0.17.5",  # keep in sync with .github/workflows/ci.yml
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
cmake.version = ">=3.28"
cmake.build-type = "Release"
ninja.make-fallback = false
wheel.packages = ["python/finforge"]
sdist.exclude = ["datasets/", ".planning/", "temp/", "build/"]

[tool.scikit-build.cmake.define]
FINFORGE_BUILD_PYTHON = "ON"
FINFORGE_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]
extend-exclude = ["temp", "build", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
