# FinForge, the whole stack in one command (PLAN Phase 9):
#   docker compose up --build        dashboard http://localhost:3000 · API http://localhost:8000/docs
#   docker compose down              stop (add -v to delete the database and stored runs)
# Only the development database (Phase 7 workflow, finforge running on the host):
#   docker compose up -d db
# Every port is published on 127.0.0.1: there is no authentication (docs/server.md §5).

x-finforge: &finforge
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-unknown}  # e.g. GIT_SHA=$(git rev-parse --short=12 HEAD) docker compose …
  image: finforge:latest
  environment:
    FINFORGE_DATABASE_URL: postgresql+psycopg://finforge:finforge@db:5432/finforge
    FINFORGE_STORAGE_DIR: /data
  volumes:
    - finforge-data:/data  # uploads, datasets and runs; shared by api, worker and demo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finforge
      POSTGRES_PASSWORD: finforge  # local development only
      POSTGRES_DB: finforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finforge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:  # one-shot: schema migrations
    <<: *finforge
    command: ["finforge", "server", "migrate"]
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *finforge
    command: ["finforge", "server", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *finforge
    command: ["finforge", "server", "worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  demo:  # one-shot: the one-year synthetic 1-minute dataset for Demo 1 (idempotent)
    <<: *finforge
    command: ["finforge", "server", "demo"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000  # what the browser calls
    image: finforge-dashboard:latest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}

volumes:
  finforge-pg:
  finforge-data:
