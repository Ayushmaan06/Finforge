name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ ${{ matrix.preset }} (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: release, cc: gcc, cxx: g++ }
          - { preset: dev, cc: gcc, cxx: g++ }        # Debug + ASan/UBSan
          - { preset: dev, cc: clang, cxx: clang++ }  # Debug + ASan/UBSan
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Tool versions
        run: cmake --version | head -1 && ninja --version && $CXX --version | head -1
      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Benchmark smoke run (release only; numbers from CI are not recorded)
        if: matrix.preset == 'release'
        run: build/release/engine/finforge_bench --benchmark_min_time=0.01s

  python:
    name: Python (build extension + pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:  # finforge.server tests (PLAN Phase 7)
        image: postgres:16
        env:
          POSTGRES_USER: finforge
          POSTGRES_PASSWORD: finforge
          POSTGRES_DB: finforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finforge" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      FINFORGE_TEST_DATABASE_URL: postgresql+psycopg://finforge:finforge@localhost:5432/finforge
      FINFORGE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag; pin exact
      - name: Build and install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[server]" --group dev
      - name: pytest
        run: .venv/bin/pytest

  dashboard:
    name: Dashboard (lint, types, OpenAPI drift, Playwright Demo 1)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finforge
          POSTGRES_PASSWORD: finforge
          POSTGRES_DB: finforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finforge" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      FINFORGE_DATABASE_URL: postgresql+psycopg://finforge:finforge@localhost:5432/finforge
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build the engine and install the server
        working-directory: .
        run: |
          uv venv --python 3.12
          uv pip install -e ".[server]"
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typed API client is up to date with the OpenAPI document
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Demo 1 end to end (builds the app, starts API + worker + demo dataset)
        run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag; pin exact
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: No floating point in the engine (NUM-1)
        run: scripts/check_no_float.sh
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' | xargs --no-run-if-empty clang-format-18 --dry-run -Werror
      - name: ruff
        run: |
          uvx ruff@0.17.5 check .
          uvx ruff@0.17.5 format --check .
